<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - CalmEd</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <a href="/" class="flex-shrink-0 flex items-center text-2xl font-bold text-blue-600">CalmEd</a>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8" id="nav-items">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
        <div class="bg-white shadow overflow-hidden sm:rounded-lg">
            <div class="px-4 py-5 sm:px-6 flex justify-between items-center">
                <div>
                    <h3 class="text-lg leading-6 font-medium text-gray-900">User Information</h3>
                    <p class="mt-1 max-w-2xl text-sm text-gray-500">Personal details and subscription status.</p>
                </div>
                <a href="/account/payments" class="inline-flex items-center px-4 py-2 border border-blue-600 text-sm font-medium rounded-md text-blue-600 bg-white hover:bg-blue-50 transition">
                    Payments
                </a>
            </div>
            <div class="border-t border-gray-200">
                <dl id="user-info">
                    <div class="bg-gray-50 px-4 py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                        <dt class="text-sm font-medium text-gray-500">Username</dt>
                        <dd id="info-username" class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">Loading...</dd>
                    </div>
                    <div class="bg-white px-4 py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                        <dt class="text-sm font-medium text-gray-500">Email address</dt>
                        <dd id="info-email" class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">Loading...</dd>
                    </div>
                    <div class="bg-gray-50 px-4 py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                        <dt class="text-sm font-medium text-gray-500">Subscription Status</dt>
                        <dd id="info-status" class="mt-1 text-sm text-gray-900 sm:mt-0 sm:col-span-2">
                            <span id="status-badge" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">
                                Checking...
                            </span>
                        </dd>
                    </div>
                </dl>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn()) {
                window.location.href = '/login';
                return;
            }

            try {
                const token = Auth.getToken();
                const response = await fetch('/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    Auth.logout();
                    return;
                }

                const user = await response.json();
                document.getElementById('info-username').innerText = user.username;
                document.getElementById('info-email').innerText = user.email;
                
                const statusBadge = document.getElementById('status-badge');
                if (user.isPaid) {
                    statusBadge.innerText = 'Premium Member';
                    statusBadge.className = 'px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800';
                } else {
                    statusBadge.innerText = 'Free Tier';
                    statusBadge.className = 'px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800';
                }
            } catch (error) {
                console.error('Error fetching user info:', error);
            }
        });
    </script>
</body>
</html>
