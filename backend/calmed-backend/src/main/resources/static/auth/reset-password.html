<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Reset Your Password</title>
	<style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            color: #333;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
	</style>
</head>
<body>
<div class="container">
	<h2>Reset Password</h2>
	<label for="newPassword"></label><input type="password" id="newPassword" placeholder="Enter new password" required>
	<label for="confirmPassword"></label><input type="password" id="confirmPassword" placeholder="Confirm new password" required>
	<button onclick="submitReset()">Update Password</button>
	<div id="message"></div>
</div>

<script>
    async function submitReset() {
        const password = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        const messageDiv = document.getElementById('message');

        // Extract token from URL: /auth/reset-password?token=XYZ
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            messageDiv.style.color = 'red';
            messageDiv.innerText = '❌ Missing reset token';
            return;
        }

        if (password !== confirm) {
            messageDiv.style.color = 'red';
            messageDiv.innerText = 'Passwords do not match';
            return;
        }

        try {
            const response = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    passwordResetToken: token,
                    newPassword: password
                })
            });

            const result = await response.json();
            if (response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.innerText = '✅ ' + result.message;
                document.querySelector('button').disabled = true;
            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = '❌ ' + (result.message || 'Error resetting password');
            }
        } catch (err) {
            messageDiv.style.color = 'red';
            messageDiv.innerText = '❌ Network error';
        }
    }
</script>
</body>
</html>
