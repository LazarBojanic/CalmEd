<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CalmEd</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/auth/en_US/appleid.auth.js"></script>
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <a href="/" class="flex-shrink-0 flex items-center text-2xl font-bold text-blue-600">CalmEd</a>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8" id="nav-items">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="min-h-[calc(100vh-64px)] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Create a new account</h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Or <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">sign in to your account</a>
            </p>
        </div>

        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
                <form id="register-form" class="space-y-4">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                        <div class="mt-1">
                            <input id="username" name="username" type="text" autocomplete="username" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                        <div class="mt-1">
                            <input id="email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="mt-1">
                            <input id="password" name="password" type="password" autocomplete="new-password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                        <div class="mt-1">
                            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
                            Register
                        </button>
                    </div>
                    <p id="error-message" class="text-red-600 text-sm mt-2"></p>
                </form>

                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">Or continue with</span>
                        </div>
                    </div>

                    <div class="mt-6 space-y-3">
                        <div id="google-login-btn" class="w-full flex justify-center min-h-[44px]"></div>
                        <button id="apple-login-btn" class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition min-h-[44px]">
                            <svg class="w-5 h-5 mr-2" viewBox="0 0 170 170"><path d="M150.37,130.25c-2.45,5.66-5.35,10.87-8.71,15.66c-8.58,12.27-17.41,24.4-30.8,24.65c-13.19,0.25-17.44-7.78-32.64-7.78 c-15.19,0-19.88,7.53-32.38,8.03c-13.19,0.5-23.19-13.24-31.81-25.65C16.23,118.32,2.4,85.02,15.34,62.5 c6.42-11.17,17.92-18.23,30.43-18.42c11.93-0.19,23.2,8.04,30.54,8.04c7.34,0,20.89-10.04,35.03-8.6 c5.92,0.25,22.54,2.39,33.22,18.02c-0.87,0.54-19.85,11.55-19.64,34.21c0.23,28.21,24.47,37.64,24.73,37.75 C159.51,118.78,154.59,120.48,150.37,130.25z M118.5,29.74c6.12-7.4,10.24-17.69,9.11-27.93c-8.79,0.35-19.43,5.85-25.73,13.25 c-5.65,6.58-10.6,17.07-9.3,27.12C101.44,42.92,112.38,37.14,118.5,29.74z"/></svg>
                            Sign up with Apple
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                document.getElementById('error-message').textContent = 'Passwords do not match';
                return;
            }

            const result = await Auth.register(email, username, password, confirmPassword);
            if (result.success) {
                if (result.loggedIn) {
                    window.location.href = '/payment';
                } else {
                    // Show success message and hide form
                    document.getElementById('register-form').innerHTML = `
                        <div class="bg-green-50 border-l-4 border-green-400 p-4">
                            <div class="flex">
                                <div class="flex-shrink-0">
                                    <svg class="h-5 w-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                                    </svg>
                                </div>
                                <div class="ml-3">
                                    <p class="text-sm text-green-700">
                                        ${result.message}
                                    </p>
                                    <div class="mt-4">
                                        <a href="/login" class="text-sm font-medium text-green-700 hover:text-green-600">
                                            Go to login &rarr;
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } else {
                document.getElementById('error-message').textContent = result.message;
            }
        });
    </script>
</body>
</html>
