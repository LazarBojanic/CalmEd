ktor:
    application:
        modules:
            - com.calmed.calmedbackend.ApplicationKt.module
    deployment:
        host: 0.0.0.0
        port: $KTOR_DEPLOYMENT_PORT:8080
    development: $KTOR_DEVELOPMENT:false

jwt:
    access_alg: ${JWT_ACCESS_ALG:HS512}
    refresh_alg: ${JWT_REFRESH_ALG:HS512}
    email_verification_alg: ${JWT_EMAIL_VERIFICATION_ALG:HS512}
    password_reset_alg: ${JWT_PASSWORD_RESET_ALG:HS512}
    iss: https://api.calm-ed.com
    aud: https://api.calm-ed.com
    access_ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh_ttl: ${JWT_REFRESH_TTL:PT720H}
    email_verification_ttl: ${JWT_EMAIL_VERIFICATION_TTL:PT24H}
    password_reset_ttl: ${JWT_PASSWORD_RESET_TTL:PT15M}
    access_secret: ${JWT_ACCESS_SECRET:placeholder}
    refresh_secret: ${JWT_REFRESH_SECRET:placeholder}
    email_verification_secret: ${JWT_EMAIL_VERIFICATION_SECRET:placeholder}
    password_reset_secret: ${JWT_PASSWORD_RESET_SECRET:placeholder}

database:
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    ip: ${DATABASE_IP:127.0.0.1}
    port: ${DATABASE_PORT:5432}
    name: ${DATABASE_NAME:calmed}
    dialect: ${DATABASE_DIALECT:postgresql}
    driver: ${DATABASE_DRIVER:org.postgresql.Driver}

email:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:placeholder}
    password: ${EMAIL_PASSWORD:placeholder}
    ssl: ${EMAIL_SSL:true}
    from_email: ${EMAIL_FROM_EMAIL:placeholder}
    from_name: ${EMAIL_FROM_NAME:placeholder}
    verification_base_url: ${EMAIL_VERIFICATION_BASE_URL:placeholder}

oauth:
    google:
        web_client_id: ${OAUTH_GOOGLE_WEB_CLIENT_ID:placeholder}
        ios_client_id: ${OAUTH_GOOGLE_IOS_CLIENT_ID:placeholder}
        android_client_id: ${OAUTH_GOOGLE_ANDROID_CLIENT_ID:placeholder}
    apple:
        ios_bundle_id: ${OAUTH_APPLE_IOS_BUNDLE_ID:placeholder}
        team_id: ${OAUTH_APPLE_TEAM_ID:placeholder}
        key_id: ${OAUTH_APPLE_KEY_ID:placeholder}
        client_id: ${OAUTH_APPLE_CLIENT_ID:placeholder}
        private_key: ${OAUTH_APPLE_PRIVATE_KEY:placeholder}
        redirect_uri: ${OAUTH_APPLE_REDIRECT_URI:placeholder}
mux:
    signing_key: ${MUX_SIGNING_KEY:placeholder}
    private_key: ${MUX_PRIVATE_KEY:placeholder}
stripe:
    secret_key: ${STRIPE_SECRET_KEY:placeholder}
    publishable_key: ${STRIPE_PUBLISHABLE_KEY:placeholder}
    webhook_secret: ${STRIPE_WEBHOOK_SECRET:placeholder}
    amount_cents: ${STRIPE_AMOUNT_CENTS:1000}
    currency: ${STRIPE_CURRENCY:usd}
    merchant_display_name: ${STRIPE_MERCHANT_DISPLAY_NAME:CalmEd}
    merchant_country_code: ${STRIPE_MERCHANT_COUNTRY_CODE:RS}
    apple_merchant_id: ${STRIPE_APPLE_MERCHANT_ID:placeholder}
